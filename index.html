<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Den — The future of switches is coming soon.</title>
  <meta name="description" content="The future of switches is coming soon. Sign up to the Den newsletter to be the first to know." />
  <meta name="theme-color" content="#ffffff" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container logo-wrap">
      <img
        src="DEN LOGO.PNG"
        alt="Den"
        class="logo"
        width="120"
        height="48"
        decoding="async"
      />
    </div>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-heading">
      <div class="container hero-grid">
        <div class="hero-copy">
          <h1 id="hero-heading" class="hero-heading">
            The future of switches is coming soon.
          </h1>
        </div>
        <div class="hero-media">
          <img
            src="Right side picture.pdf.png"
            alt=""
            class="hero-image"
            decoding="async"
            loading="eager"
          />
        </div>
      </div>
    </section>

    <section class="video" aria-label="Product video">
      <div class="container">
        <div class="video-frame">
          <iframe
            src="https://player.vimeo.com/video/261310683?title=0&byline=0&portrait=0&dnt=1"
            title="Den video"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </section>

    <section class="newsletter" aria-labelledby="newsletter-heading">
      <div class="container newsletter-inner">
        <h2 id="newsletter-heading" class="visually-hidden">Newsletter</h2>
        <button
          type="button"
          class="btn btn-primary"
          id="openNewsletter"
          aria-haspopup="dialog"
          aria-controls="newsletterDialog"
        >
          Sign up to newsletter
        </button>
      </div>
    </section>

    <section class="contact" aria-label="Contact">
      <div class="container contact-inner">
        <a class="contact-link" href="mailto:hello@getden.co.uk">hello@getden.co.uk</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="copyright">Copyright Den Innovation Ltd 2026</p>
    </div>
  </footer>

  <!-- Newsletter dialog -->
  <div
    class="dialog-backdrop"
    id="newsletterDialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle"
    aria-describedby="dialogDescription"
    hidden
  >
    <div class="dialog" role="document">
      <button type="button" class="dialog-close" id="closeNewsletter" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
      </button>

      <h3 id="dialogTitle" class="dialog-title">Sign up to newsletter</h3>
      <p id="dialogDescription" class="dialog-desc">
        Be the first to hear when the future of switches arrives.
      </p>

      <form id="newsletterForm" class="form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            required
            minlength="1"
            maxlength="80"
          />
          <p class="field-error" data-error-for="name" role="alert"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            maxlength="254"
          />
          <p class="field-error" data-error-for="email" role="alert"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          Sign up
        </button>

        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
